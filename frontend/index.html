<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INCREDIBLE_x_TECH - Asana Collaborative Platform</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/landing.css">
  <link rel="stylesheet" href="css/list.css">
  <link rel="stylesheet" href="css/board.css">
  <link rel="stylesheet" href="css/modal.css">
</head>
<body>
  <div id="landing-mode-root" class="landing-mode-container"></div>

  <div id="workspace-mode-root" class="asana-layout hidden">
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <aside class="asana-sidebar" id="asana-sidebar-el">
      <div class="sidebar-header">
        <div class="asana-logo-wrap" id="sidebar-logo-home" style="cursor: pointer;">
          <div class="asana-logo-mark">IXT</div>
          <span class="asana-brand-text">INCREDIBLE_x_TECH</span>
        </div>
      </div>

      <button class="sidebar-create-btn" id="btn-sidebar-create">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 2a.75.75 0 0 1 .75.75v4.5h4.5a.75.75 0 0 1 0 1.5h-4.5v4.5a.75.75 0 0 1-1.5 0v-4.5h-4.5a.75.75 0 0 1 0-1.5h4.5v-4.5A.75.75 0 0 1 8 2Z"/>
        </svg>
        Create Task
      </button>

      <div class="sidebar-nav-list">
        <div class="sidebar-nav-item" id="sidebar-nav-landing">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
            <path d="m8 1.25 6 4.5V14a1 1 0 0 1-1 1H9.5v-4.5h-3V15H3a1 1 0 0 1-1-1V5.75l6-4.5Z"/>
          </svg>
          Landing Page
        </div>
        <div class="sidebar-nav-item active" id="sidebar-nav-tasks">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0ZM1.5 8a6.5 6.5 0 1 1 13 0 6.5 6.5 0 0 1-13 0Zm9.78-2.28-4.5 4.5a.75.75 0 0 1-1.06 0l-2-2a.75.75 0 1 1 1.06-1.06L6.25 8.69l3.97-3.97a.75.75 0 1 1 1.06 1.06Z"/>
          </svg>
          Tasks
        </div>
        <div class="sidebar-nav-item" id="sidebar-inbox-item">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
            <path d="M2.5 2A1.5 1.5 0 0 0 1 3.5v9A1.5 1.5 0 0 0 2.5 14h11a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 13.5 2h-11Zm0 1.5h11a.5.5 0 0 1 .5.5v4.5H10.5a2 2 0 0 0-1.938 1.5h-1.124A2 2 0 0 0 5.5 8.5H2V4a.5.5 0 0 1 .5-.5Z"/>
          </svg>
          Inbox
          <span class="badge badge-urgent hidden" id="sidebar-notif-count" style="margin-left: auto;">0</span>
        </div>
      </div>

      <div class="sidebar-section-title">
        <span>Projects</span>
        <button class="btn-icon" id="btn-sidebar-add-proj" style="color: #8c8f94;" title="Add Project">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 2a.75.75 0 0 1 .75.75v4.5h4.5a.75.75 0 0 1 0 1.5h-4.5v4.5a.75.75 0 0 1-1.5 0v-4.5h-4.5a.75.75 0 0 1 0-1.5h4.5v-4.5A.75.75 0 0 1 8 2Z"/>
          </svg>
        </button>
      </div>

      <div class="sidebar-projects-list" id="sidebar-projects-container"></div>

      <div class="sidebar-footer">
        <div class="sidebar-user-card" id="sidebar-user-btn">
          <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&auto=format&fit=crop&q=80" alt="User" class="sidebar-user-avatar" id="sidebar-avatar-img" />
          <div style="display: flex; flex-direction: column;">
            <span class="sidebar-user-name" id="sidebar-user-display-name">Sarah Chen</span>
            <span class="sidebar-user-role" id="sidebar-user-display-role">Staff Architect</span>
          </div>
        </div>
      </div>
    </aside>

    <div class="asana-main-workspace">
      <header class="asana-top-bar">
        <div class="top-bar-left-controls">
          <button class="btn-mobile-sidebar-toggle" id="btn-mobile-sidebar-toggle" title="Toggle Sidebar">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
              <path d="M1 2.75A.75.75 0 0 1 1.75 2h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 2.75Zm0 5A.75.75 0 0 1 1.75 7h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 7.75ZM1.75 12h12.5a.75.75 0 0 1 0 1.5H1.75a.75.75 0 0 1 0-1.5Z"/>
            </svg>
          </button>
          <div class="top-bar-search">
            <span class="search-icon">
              <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
                <path d="M11.5 7a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0Zm-.82 4.74a6 6 0 1 0-1.06 1.06l3.65 3.65a.75.75 0 1 0 1.06-1.06l-3.65-3.65Z"/>
              </svg>
            </span>
            <input type="text" id="asana-global-search" placeholder="Search tasks, descriptions..." />
          </div>
        </div>

        <div class="top-bar-actions">
          <div class="ws-sync-badge">
            <span class="sync-dot" id="ws-sync-dot"></span>
            <span id="ws-sync-label">Connecting</span>
          </div>

          <button class="btn-icon" id="top-notif-btn" title="Notifications" style="position: relative;">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor">
              <path d="M8 1.5c-.966 0-1.75.784-1.75 1.75v.31a4.5 4.5 0 0 0-3.25 4.315v2.336L2.146 11.06A.75.75 0 0 0 2.75 12.25h10.5a.75.75 0 0 0 .604-1.19L13 10.211V7.875a4.5 4.5 0 0 0-3.25-4.315v-.31C9.75 2.284 8.966 1.5 8 1.5ZM6.5 13.5a1.5 1.5 0 0 0 3 0h-3Z"/>
            </svg>
            <span class="badge badge-urgent hidden" id="top-notif-badge" style="position: absolute; top: -2px; right: -2px; font-size: 9px; padding: 1px 4px;">0</span>
          </button>

          <button class="btn-secondary" id="btn-top-switch-account" style="font-size: 12px; padding: 4px 8px;">
            Switch Account
          </button>

          <button class="btn-secondary" id="btn-return-landing" style="font-size: 12px; padding: 4px 10px; background-color: #fafbfc;">
            Landing Page
          </button>
        </div>
      </header>

      <div class="asana-project-header">
        <div class="project-title-row">
          <div class="project-title-left">
            <div class="project-tile-icon" id="project-tile-initial">P</div>
            <div>
              <div style="display: flex; align-items: center; gap: 8px;">
                <h1 class="project-heading" id="project-title-display">Project Name</h1>
                <span class="project-status-pill">On Track</span>
              </div>
            </div>
          </div>

          <div class="project-title-right">
            <div class="member-stack-wrap" id="project-header-member-stack"></div>
            <button class="btn-invite-members" id="btn-invite-collaborator">+ Invite</button>
          </div>
        </div>

        <nav class="asana-nav-tabs">
          <button class="asana-tab active" data-tab="list">List</button>
          <button class="asana-tab" data-tab="board">Board</button>
          <button class="asana-tab" data-tab="overview">Overview</button>
          <button class="asana-tab" data-tab="activity">Messages & Activity</button>
        </nav>
      </div>

      <div class="asana-filter-toolbar">
        <div class="filter-toolbar-left">
          <button class="btn-asana-add-task" id="btn-asana-add-task-bar">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
              <path d="M8 2a.75.75 0 0 1 .75.75v4.5h4.5a.75.75 0 0 1 0 1.5h-4.5v4.5a.75.75 0 0 1-1.5 0v-4.5h-4.5a.75.75 0 0 1 0-1.5h4.5v-4.5A.75.75 0 0 1 8 2Z"/>
            </svg>
            Add Task
          </button>

          <select id="asana-priority-filter" style="font-size: 12px; padding: 4px 8px;">
            <option value="ALL">All Priorities</option>
            <option value="Urgent">Urgent</option>
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
          </select>
        </div>

        <div class="filter-toolbar-right">
          <span style="font-size: 11px; color: var(--asana-text-muted);" id="task-filter-count-label"></span>
        </div>
      </div>

      <div class="asana-content-split">
        <div class="asana-viewport" id="asana-viewport-root"></div>
        <div class="asana-detail-pane closed" id="asana-detail-pane"></div>
      </div>

      <footer class="asana-footer-bar">
        <div>INCREDIBLE_x_TECH Asana Platform Workspace</div>
        <div class="footer-nav-links">
          <button id="btn-open-tos">Terms of Service</button>
          <button id="btn-open-privacy">Privacy Policy</button>
        </div>
      </footer>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
